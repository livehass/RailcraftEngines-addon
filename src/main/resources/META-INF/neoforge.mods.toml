modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"

authors="Livehass"

description='''
Railcraft Engines is an addon for Railcraft Reborn that brings back the classic steam engines from the original Railcraft.

The addon aims to restore the Hobbyist, Commercial and Industrial Steam Engines with their classic behavior, animations and integration with Railcraft Reborn's steam system.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="railcraft"
type="required"
reason="Railcraft Engines requires Railcraft Reborn."
versionRange="[1.2.10,1.3)"
ordering="AFTER"
side="BOTH"